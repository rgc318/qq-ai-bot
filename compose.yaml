name: qq-ai-bot

services:
  astrbot:
    image: soulter/astrbot:v4.29.1@sha256:a140a326163ac5f82f62153f033cddeac74e38e4ee1809c6e333e950ff19edc4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Shanghai
    env_file:
      - ./secrets/model-api.env
    ports:
      - "127.0.0.1:6185:6185"
    expose:
      - "6199"
    volumes:
      - astrbot-data:/AstrBot/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6185/', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  snowluma:
    image: motricseven7/snowluma:v2.1.1@sha256:d1afe0a15ef66aeb3a591d855e8e0064f971f11b4aaa2315ba24750853a0ec0e
    restart: unless-stopped
    shm_size: 1gb
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    env_file:
      - ./secrets/snowluma.env
    environment:
      TZ: Asia/Shanghai
      SNOWLUMA_UID: "1000"
      SNOWLUMA_GID: "1000"
      SNOWLUMA_ONEBOT_HOST: "0.0.0.0"
      SNOWLUMA_WEBUI_HOST: "0.0.0.0"
      SNOWLUMA_WEBUI_PORT: "5099"
      SNOWLUMA_LOG_LEVEL: info
      SNOWLUMA_SCREEN: "1280x800x24"
      SNOWLUMA_HOOK_AUTOLOAD: "1"
      SNOWLUMA_QQ_FLAGS: "--disable-gpu --disable-software-rasterizer --disable-gpu-compositing"
    ports:
      - "127.0.0.1:5099:5099"
      - "127.0.0.1:6081:6081"
    volumes:
      - snowluma-data:/app/data
      - qq-client-config:/app/.config
      - qq-client-data:/app/.local/share
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5099/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  astrbot-data:
  snowluma-data:
  qq-client-config:
  qq-client-data:
