<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上下文后端</title>
<style>
:root{font-family:system-ui,sans-serif;color:#173b39;background:#f1f6f4}body{max-width:900px;margin:40px auto;padding:0 24px}h1{font-size:28px;margin-bottom:8px}.muted{color:#627a74;line-height:1.8}.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:26px 0}.card{border:2px solid #d9e5e0;border-radius:18px;background:white;padding:24px}.card.active{border-color:#16846a}h2{font-size:20px}.tag{font-size:13px;color:#16846a}button{border:0;border-radius:10px;padding:11px 18px;background:#14765f;color:white;cursor:pointer;font-size:15px}button:disabled{background:#b9c9c4;cursor:default}.panel{background:white;padding:22px;border-radius:16px;margin-top:20px}.stats{display:flex;gap:34px;flex-wrap:wrap}.stat{font-size:25px}.label{font-size:13px;color:#627a74}.notice{min-height:30px;margin-top:16px;line-height:1.6}.error{color:#b04035}#refresh{background:#e2eee9;color:#20584a}@media(max-width:650px){.cards{grid-template-columns:1fr}body{margin-top:20px}}
</style><script type="module" src="./app.js"></script></head><body>
<p class="tag">群聊上下文</p><h1>选择上下文后端</h1><p class="muted">一次只运行一个后端。原消息、图片和人格档案共用，切换不会清空历史。正在回复、生图或等待接话时，请完成后再切换。</p>
<div class="cards"><section class="card" id="card-builtin"><h2>本地后端</h2><p class="muted">保留当前上下文与附件处理方式。</p><button data-mode="builtin" disabled>切换到本地</button><p class="tag" id="state-builtin"></p></section>
<section class="card" id="card-contextaware"><h2>ContextAware</h2><p class="muted">提供带来源的近期消息和图片资料，由模型按需回看、选择参考图。</p><button data-mode="contextaware" disabled>切换到 ContextAware</button><p class="tag" id="state-contextaware"></p></section></div>
<div class="panel"><div class="stats"><div><div class="stat" id="active">—</div><div class="label">进行中的请求</div></div><div><div class="stat" id="samples">—</div><div class="label">近期准备样本</div></div><div><div class="stat" id="latency">—</div><div class="label">本地准备 p95，不含模型等待</div></div></div><p class="muted">普通文字不新增模型判断或摘要调用。历史看图、文档读取等按需工具会产生实际处理时间。</p><button id="refresh">刷新状态</button><p class="notice" id="notice">正在连接后台…</p></div></body></html>
